# 猫皮肤注册表
# 皮肤 id 同时是 classpath 下的资源根目录，目录结构约定：
#   <id>/<action>/<action>_<n>.png   （如 calico_cat/sleep/sleep_1.png）
# 新增皮肤：放入对应资源目录，并在 skins 列表追加一行即可，无需修改代码。
# 注意：Properties 文件默认 ISO-8859-1 编码，非 ASCII 字符需使用 \uXXXX 转义。

skins=calico_cat,grey_tabby_cat,orange_cat,white_cat

skin.calico_cat.name=Calico Cat
skin.grey_tabby_cat.name=Grey Tabby Cat
skin.orange_cat.name=Orange Cat
skin.white_cat.name=White Cat
